<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning - CourseCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #050814; 
            color: #fff; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        .bg-wrapper { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0;
            background: linear-gradient(135deg, #050814 0%, #0a1128 50%, #050814 100%);
        }
        .bg-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            animation: bgRotate 20s linear infinite;
        }
        @keyframes bgRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .navbar { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: rgba(10, 17, 40, 0.7); 
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1); 
            padding: 18px 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 26px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            text-decoration: none;
        }
        .logo-icon { 
            width: 48px; 
            height: 48px; 
            background: linear-gradient(135deg, #6366f1, #a855f7); 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.8); }
        }
        .nav-items { display: flex; align-items: center; gap: 35px; }
        .nav-link { 
            color: rgba(255, 255, 255, 0.75); 
            text-decoration: none; 
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.3s;
        }
        .nav-link:hover { color: #fff; }
        .nav-link:hover::after { width: 100%; }
        .nav-link.active { color: #fff; }
        .nav-link.active::after { width: 100%; }
        .logout-btn { 
            background: linear-gradient(135deg, #ec4899, #8b5cf6); 
            color: white; 
            border: none; 
            padding: 11px 26px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }
        .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5); }
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 40px; position: relative; z-index: 1; }
        .page-header { 
            text-align: center; 
            margin-bottom: 60px; 
            padding: 40px 20px;
            position: relative;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
        }
        .page-title { 
            font-size: 56px; 
            font-weight: 900; 
            margin-bottom: 15px; 
            background: linear-gradient(135deg, #fff 0%, #6366f1 50%, #a855f7 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            line-height: 1.1;
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-subtitle { 
            font-size: 18px; 
            color: rgba(255, 255, 255, 0.6); 
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }
        .stats-bar {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }
        .stat-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 25px 40px;
            text-align: center;
            min-width: 200px;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .courses-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 35px; 
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .course-card { 
            background: rgba(17, 24, 39, 0.6); 
            backdrop-filter: blur(20px); 
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid rgba(99, 102, 241, 0.15); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }
        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            opacity: 0;
            transition: opacity 0.4s;
        }
        .course-card:hover { 
            transform: translateY(-12px); 
            border-color: rgba(99, 102, 241, 0.4); 
            box-shadow: 0 25px 60px rgba(99, 102, 241, 0.3); 
        }
        .course-card:hover::before { opacity: 1; }
        .course-thumb { width: 100%; height: 220px; position: relative; overflow: hidden; }
        .course-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .course-card:hover .course-thumb img { transform: scale(1.1); }
        .course-thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
        }
        .course-badge { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: rgba(34, 197, 94, 0.9); 
            backdrop-filter: blur(10px);
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .progress-badge {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
        }
        .course-content { padding: 28px; position: relative; }
        .course-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #fff; line-height: 1.3; }
        .course-desc { font-size: 14px; color: rgba(255, 255, 255, 0.55); margin-bottom: 20px; line-height: 1.6; }
        .course-meta { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-top: 20px; 
            border-top: 1px solid rgba(99, 102, 241, 0.1); 
        }
        .course-instructor { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 14px; 
            color: rgba(255, 255, 255, 0.7); 
        }
        .instructor-avatar { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .course-level {
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            color: #a78bfa;
            text-transform: capitalize;
        }
        .progress-bar-container {
            margin-top: 20px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
            transition: width 0.3s;
        }
        .continue-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }
        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }
        .loading, .empty-state { 
            text-align: center; 
            padding: 100px 20px; 
            grid-column: 1 / -1; 
        }
        .spinner { 
            width: 60px; 
            height: 60px; 
            border: 4px solid rgba(99, 102, 241, 0.1); 
            border-top: 4px solid #6366f1; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 30px; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state-icon { 
            font-size: 80px; 
            margin-bottom: 25px; 
            opacity: 0.4; 
        }
        .empty-state-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .empty-state-text { 
            font-size: 16px; 
            color: rgba(255, 255, 255, 0.5); 
            margin-bottom: 30px;
        }
        .browse-btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) { 
            .page-title { font-size: 36px; }
            .courses-grid { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; align-items: center; }
            .stat-card { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="bg-wrapper"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" fill="none" stroke="white" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <span>CourseCraft</span>
            </a>
            <div class="nav-items">
                <a href="index.html" class="nav-link">Courses</a>
                <a href="Mylearning.html" class="nav-link active">My Learning</a>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">My Learning Journey 📚</h1>
            <p class="page-subtitle">Continue where you left off and master your skills</p>
        </div>
        
        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalCourses">0</div>
                <div class="stat-label">Enrolled Courses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCourses">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgressCourses">0</div>
                <div class="stat-label">In Progress</div>
            </div>
        </div>
        
        <div class="courses-grid" id="coursesGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your courses...</p>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:8000";

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        // Fetch purchased courses
        async function fetchMyCourses() {
            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`${API}/course/myLearning/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    // Token expired, try to refresh
                    const refreshed = await refreshToken();
                    if (refreshed) {
                        return fetchMyCourses();
                    } else {
                        logout();
                        return;
                    }
                }

                if (!response.ok) {
                    throw new Error('Failed to fetch courses');
                }

                const data = await response.json();
                displayCourses(data.results || data);
                updateStats(data.results || data);
                
            } catch (error) {
                console.error('Error:', error);
                displayError();
            }
        }

        // Display courses
        function displayCourses(purchases) {
            const grid = document.getElementById('coursesGrid');
            
            if (!purchases || purchases.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <div class="empty-state-title">No Courses Yet</div>
                        <p class="empty-state-text">Start your learning journey by enrolling in a course!</p>
                        <a href="index.html" class="browse-btn">Browse Courses</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = purchases.map(purchase => {
                const course = purchase.course;
                const progress = 0; // You can add progress tracking later
                
                // Handle course image
                const img = course.course_img
                    ? `<img src="${course.course_img}" alt="${course.course_name}">`
                    : `<div class="course-thumb-placeholder">📘</div>`;

                // Get instructor name and initial
                const instructor = course.instructor_name || "Instructor";
                const instructorInitial = instructor.charAt(0).toUpperCase();

                return `
                    <div class="course-card" onclick="goToCourse(${course.id})">
                        <div class="course-thumb">
                            ${img}
                            <div class="course-badge">Enrolled</div>
                            ${progress > 0 ? `<div class="progress-badge">${progress}% Complete</div>` : ''}
                        </div>
                        <div class="course-content">
                            <div class="course-title">${course.course_name}</div>
                            <div class="course-desc">${course.short_description || "No description available"}</div>
                            
                            <div class="progress-bar-container">
                                <div class="progress-bar" style="width: ${progress}%"></div>
                            </div>
                            
                            <div class="course-meta">
                                <div class="course-instructor">
                                    <div class="instructor-avatar">${instructorInitial}</div>
                                    <span>${instructor}</span>
                                </div>
                                <div class="course-level">${course.levels || "Beginner"}</div>
                            </div>
                            
                            <button class="continue-btn" onclick="event.stopPropagation(); goToCourse(${course.id})">
                                ${progress > 0 ? 'Continue Learning' : 'Start Learning'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update statistics
        function updateStats(purchases) {
            if (!purchases || purchases.length === 0) return;
            
            const statsBar = document.getElementById('statsBar');
            const totalCourses = purchases.length;
            const completed = 0; // You can calculate this based on progress
            const inProgress = totalCourses - completed;

            document.getElementById('totalCourses').textContent = totalCourses;
            document.getElementById('completedCourses').textContent = completed;
            document.getElementById('inProgressCourses').textContent = inProgress;
            
            statsBar.style.display = 'flex';
        }

        // Display error
        function displayError() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = `
                <div class="error-message">
                    <p>❌ Failed to load your courses. Please try again later.</p>
                </div>
            `;
        }

        // Refresh token
        async function refreshToken() {
            const refreshToken = localStorage.getItem('refresh_token');
            
            try {
                const response = await fetch(`${API}/api/auth/refresh/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refresh: refreshToken })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access);
                    return true;
                } else {
                    return false;
                }
            } catch (error) {
                console.error('Refresh error:', error);
                return false;
            }
        }

        // Navigate to course detail
        function goToCourse(courseId) {
            window.location.href = `detail.html?id=${courseId}`;
        }

        // Logout
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Event listeners
        document.getElementById('logoutBtn').onclick = logout;

        // Initialize
        if (checkAuth()) {
            fetchMyCourses();
        }
    </script>
</body>
</html>
