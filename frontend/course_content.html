<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course Content - CourseCraft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#050814;color:#fff;min-height:100vh}
nav{background:rgba(10,17,40,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(99,102,241,.2);padding:14px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200}
.logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav-r{display:flex;gap:14px;align-items:center}
.btn-sm{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:13px}
.btn-back{background:rgba(99,102,241,.15);color:#a78bfa;border:1px solid rgba(99,102,241,.3)}
.btn-back:hover{background:rgba(99,102,241,.3)}
.btn-logout{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 57px)}
/* Sidebar */
.sidebar{background:rgba(10,17,40,.9);border-right:1px solid rgba(99,102,241,.15);overflow-y:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.sidebar-head{padding:20px 22px;border-bottom:1px solid rgba(99,102,241,.1)}
.sidebar-head h2{font-size:16px;font-weight:700;color:#a78bfa;margin-bottom:4px}
.sidebar-head p{font-size:12px;color:rgba(255,255,255,.45)}
.section-list{padding:12px 0}
.sec-item{display:flex;gap:12px;align-items:flex-start;padding:14px 22px;cursor:pointer;border-left:3px solid transparent;transition:.25s}
.sec-item:hover{background:rgba(99,102,241,.08);border-left-color:rgba(99,102,241,.4)}
.sec-item.active{background:rgba(99,102,241,.12);border-left-color:#6366f1}
.sec-num{width:28px;height:28px;border-radius:50%;background:rgba(99,102,241,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#a78bfa;flex-shrink:0;margin-top:2px}
.sec-item.active .sec-num{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
.sec-item.has-video .sec-num::after{content:""}
.sec-meta h4{font-size:14px;font-weight:600;margin-bottom:4px;color:rgba(255,255,255,.9)}
.sec-meta p{font-size:12px;color:rgba(255,255,255,.45);line-height:1.4}
.sec-badge{display:inline-block;padding:2px 8px;background:rgba(99,102,241,.2);border-radius:10px;font-size:10px;color:#a78bfa;margin-top:4px}
.sec-badge.preview{background:rgba(34,197,94,.15);color:#86efac}
/* Main content */
.main{overflow-y:auto}
.video-area{background:#000;position:relative;width:100%}
.video-area video{width:100%;max-height:480px;display:block}
.no-video{width:100%;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.08));color:rgba(255,255,255,.35);font-size:48px;gap:14px}
.no-video p{font-size:15px}
.content-area{padding:28px 32px}
.course-title-bar{font-size:26px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.section-title-bar{font-size:18px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:16px}
.desc-box{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);border-radius:14px;padding:18px 22px;font-size:14px;color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:24px}
/* Tabs */
.tabs{display:flex;gap:10px;margin-bottom:24px;border-bottom:1px solid rgba(99,102,241,.12);padding-bottom:0}
.tab{padding:10px 20px;background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.25s}
.tab.active,.tab:hover{color:#a78bfa;border-bottom-color:#6366f1}
.panel{display:none}.panel.active{display:block}
/* AI Practice */
.card{background:rgba(17,24,39,.75);border:1px solid rgba(99,102,241,.2);border-radius:16px;padding:24px;margin-bottom:18px}
label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px;font-weight:500;margin-top:10px}
input,select,textarea{width:100%;padding:11px 15px;background:rgba(255,255,255,.06);border:1px solid rgba(99,102,241,.22);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;margin-bottom:4px;transition:.25s}
input:focus,select:focus,textarea:focus{border-color:#6366f1;box-shadow:0 0 15px rgba(99,102,241,.2)}
select option{background:#0a1128}
.btn{padding:11px 24px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:.3s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(99,102,241,.5)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-sec2{background:rgba(99,102,241,.15);color:#a78bfa;border:1px solid rgba(99,102,241,.25)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.q-card{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.18);border-radius:14px;padding:22px;margin-bottom:14px;animation:up .35s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:11px;color:#6366f1;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.q-text{font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:10px 14px;border-radius:9px;border:1px solid rgba(99,102,241,.2);background:rgba(255,255,255,.04);cursor:pointer;transition:.22s;font-size:13px}
.opt:hover{border-color:#6366f1;background:rgba(99,102,241,.15)}
.opt.correct{border-color:#22c55e!important;background:rgba(34,197,94,.13)!important;color:#86efac}
.opt.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.11)!important;color:#fca5a5}
.opt.picked{border-color:#6366f1;background:rgba(99,102,241,.2)}
.exp{margin-top:12px;padding:11px 15px;background:rgba(168,85,247,.1);border-left:3px solid #a855f7;border-radius:0 8px 8px 0;font-size:13px;color:rgba(255,255,255,.7);display:none}
.score-box{text-align:center;padding:24px;background:rgba(99,102,241,.08);border-radius:14px;margin-top:16px;display:none}
.score-num{font-size:36px;font-weight:800;color:#a78bfa;margin-bottom:8px}
.sbar{background:rgba(99,102,241,.1);border-radius:8px;height:8px;margin:8px auto;max-width:300px}
.sfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#6366f1,#a855f7);transition:width .6s ease}
.chip{display:inline-block;padding:5px 12px;background:rgba(99,102,241,.14);border-radius:16px;font-size:12px;color:#a78bfa;margin:3px;cursor:pointer;border:1px solid rgba(99,102,241,.2);transition:.2s}
.chip:hover{background:rgba(99,102,241,.28)}
.empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.35)}
.empty-icon{font-size:44px;margin-bottom:12px}
.nav-arrows{display:flex;gap:10px;margin-top:16px}
.syllabus-content{white-space:pre-wrap;font-size:13px;color:rgba(255,255,255,.7);line-height:1.8;background:rgba(255,255,255,.03);border-radius:10px;padding:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{max-height:280px;position:static;border-right:none;border-bottom:1px solid rgba(99,102,241,.15)}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">CourseCraft</a>
  <div class="nav-r">
    <button class="btn-sm btn-back" onclick="history.back()">&#8592; My Learning</button>
    <button class="btn-sm btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="layout">
  <!-- SIDEBAR: Curriculum -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2 id="sb-course">Loading...</h2>
      <p id="sb-count">0 sections</p>
    </div>
    <div class="section-list" id="section-list">
      <div class="empty"><div class="empty-icon">&#x23F3;</div><p>Loading...</p></div>
    </div>
  </aside>
  <!-- MAIN -->
  <div class="main">
    <div class="video-area" id="video-area">
      <div class="no-video" id="no-video">
        <span>&#x1F3AC;</span><p>Select a section to watch</p>
      </div>
      <video id="video-player" controls style="display:none"></video>
    </div>
    <div class="content-area">
      <div class="course-title-bar" id="course-title">Loading course...</div>
      <div class="section-title-bar" id="section-title">Select a section from the left</div>
      <div class="tabs">
        <button class="tab active" onclick="showPanel('desc',this)">&#x1F4DD; Overview</button>
        <button class="tab" onclick="showPanel('syllabus',this)">&#x1F4DA; Syllabus</button>
        <button class="tab" onclick="showPanel('practice',this)">&#x1F916; AI Practice</button>
      </div>
      <!-- Overview -->
      <div class="panel active" id="panel-desc">
        <div class="desc-box" id="sec-desc">Select a section from the left panel to begin learning.</div>
        <div class="nav-arrows">
          <button class="btn btn-sec2" id="btn-prev" onclick="navSection(-1)" style="display:none">&#8592; Previous</button>
          <button class="btn btn-primary" id="btn-next" onclick="navSection(1)" style="display:none">Next &#8594;</button>
        </div>
      </div>
      <!-- Syllabus -->
      <div class="panel" id="panel-syllabus">
        <div class="card">
          <h3 style="color:#a78bfa;margin-bottom:14px">&#x1F4DA; Course Syllabus</h3>
          <div id="syllabus-content" class="syllabus-content">Loading syllabus...</div>
        </div>
      </div>
      <!-- AI Practice -->
      <div class="panel" id="panel-practice">
        <div class="card">
          <h3 style="color:#a78bfa;margin-bottom:16px">&#x1F916; AI Practice Questions</h3>
          <label>Topic to Practice</label>
          <input id="pr-topic" type="text" placeholder="e.g. Arrays, SQL Joins, React Hooks...">
          <div id="chips" style="margin:6px 0 12px"></div>
          <div style="display:flex;gap:10px;align-items:center">
            <select id="pr-num" style="width:auto">
              <option value="3">3 Qs</option>
              <option value="5" selected>5 Qs</option>
              <option value="8">8 Qs</option>
            </select>
            <button class="btn btn-primary" id="pr-btn" onclick="genQ()">
              <div class="spin" id="pr-spin"></div>
              <span id="pr-btxt">&#x2728; Generate</span>
            </button>
          </div>
        </div>
        <div id="quiz-area"></div>
        <div class="score-box" id="score-box">
          <div class="score-num" id="score-num"></div>
          <div class="sbar"><div class="sfill" id="sfill"></div></div>
          <p id="score-msg" style="color:rgba(255,255,255,.55);margin-top:8px"></p>
          <button class="btn btn-sec2" style="margin-top:14px" onclick="genQ()">Try Again &#x1F504;</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const API="http://localhost:8000";
const params=new URLSearchParams(location.search);
const courseId=params.get("id");
let sections=[],curIdx=-1,questions=[],answers={},submitted=false;

function logout(){localStorage.clear();location.href="login.html"}
function tok(){return localStorage.getItem("access_token")}
function ah(){return{"Authorization":"Bearer "+tok(),"Content-Type":"application/json"}}

function showPanel(id,btn){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
  document.getElementById("panel-"+id).classList.add("active");
  btn.classList.add("active");
}

async function init(){
  if(!tok()){location.href="login.html";return}
  if(!courseId){document.getElementById("course-title").textContent="No course selected";return}
  await loadSections();
  await loadSyllabus();
  if(sections.length) selectSection(0);
}

async function loadSections(){
  try{
    var r=await fetch(API+"/learning/sections/"+courseId+"/",{headers:{"Authorization":"Bearer "+tok()}});
    var d=await r.json();
    var list=document.getElementById("section-list");
    var sb=document.getElementById("sb-course");
    if(r.ok){
      sb.textContent=d.course||"Course";
      document.getElementById("course-title").textContent=d.course||"Course";
      sections=d.sections||[];
      document.getElementById("sb-count").textContent=sections.length+" section"+(sections.length!==1?"s":"");
      if(!sections.length){list.innerHTML='<div class="empty"><div class="empty-icon">&#x1F4D6;</div><p>No sections added yet</p></div>';return}
      list.innerHTML=sections.map(function(s,i){
        return '<div class="sec-item'+(s.video_url?" has-video":"")+'" id="si-'+i+'" onclick="selectSection('+i+')">'
          +'<div class="sec-num">'+(i+1)+'</div>'
          +'<div class="sec-meta"><h4>'+s.title+'</h4>'
          +(s.description?'<p>'+s.description.substring(0,80)+(s.description.length>80?"...":"")+'</p>':"")
          +(s.duration_minutes?'<span class="sec-badge">'+s.duration_minutes+' min</span>':"")
          +(s.is_preview?'<span class="sec-badge preview">Free Preview</span>':"")
          +(s.video_url?'<span class="sec-badge">&#x1F3AC; Video</span>':"")
          +'</div></div>';
      }).join("");
    } else {
      list.innerHTML='<div class="empty"><div class="empty-icon">&#x1F4DA;</div><p>No curriculum available</p></div>';
    }
  }catch(e){console.error(e)}
}

function selectSection(idx){
  if(idx<0||idx>=sections.length) return;
  curIdx=idx;
  var s=sections[idx];
  document.querySelectorAll(".sec-item").forEach(function(el){el.classList.remove("active")});
  var el=document.getElementById("si-"+idx);
  if(el){el.classList.add("active");el.scrollIntoView({block:"nearest"})}
  document.getElementById("section-title").textContent=s.title;
  document.getElementById("sec-desc").textContent=s.description||"No description for this section.";
  var vp=document.getElementById("video-player");
  var nv=document.getElementById("no-video");
  if(s.video_url){
    vp.src=s.video_url; vp.style.display="block"; nv.style.display="none"; vp.load();
  } else {
    vp.style.display="none"; nv.style.display="flex";
  }
  document.getElementById("btn-prev").style.display=idx>0?"inline-flex":"none";
  document.getElementById("btn-next").style.display=idx<sections.length-1?"inline-flex":"none";
  loadTopicChips(s.title);
}

function navSection(dir){selectSection(curIdx+dir)}

function loadTopicChips(sectionTitle){
  var ch=document.getElementById("chips");
  ch.innerHTML="";
  var words=[sectionTitle].concat((sectionTitle||"").split(/\s+/)).filter(function(w){return w.length>3}).slice(0,5);
  words.forEach(function(w){
    var sp=document.createElement("span");
    sp.className="chip"; sp.textContent=w;
    sp.onclick=function(){document.getElementById("pr-topic").value=w};
    ch.appendChild(sp);
  });
}

async function loadSyllabus(){
  try{
    var r=await fetch(API+"/learning/syllabus/"+courseId+"/",{headers:{"Authorization":"Bearer "+tok()}});
    var d=await r.json();
    var el=document.getElementById("syllabus-content");
    if(r.ok && d.content){el.textContent=d.content}
    else{el.textContent="No syllabus has been uploaded for this course yet."}
  }catch(e){document.getElementById("syllabus-content").textContent="Unable to load syllabus."}
}

async function genQ(){
  var topic=document.getElementById("pr-topic").value.trim();
  if(!topic){alert("Enter a topic first");return}
  var btn=document.getElementById("pr-btn"),sp=document.getElementById("pr-spin"),bt=document.getElementById("pr-btxt");
  btn.disabled=true; sp.style.display="block"; bt.textContent="Generating...";
  document.getElementById("quiz-area").innerHTML='<div class="empty"><div class="empty-icon">&#x23F3;</div><p>Crafting questions...</p></div>';
  document.getElementById("score-box").style.display="none";
  questions=[]; answers={}; submitted=false;
  try{
    var r=await fetch(API+"/learning/practice/generate/",{method:"POST",headers:ah(),body:JSON.stringify({course_id:courseId,topic:topic,num_questions:parseInt(document.getElementById("pr-num").value)})});
    var d=await r.json();
    if(r.ok && d.questions && d.questions.length){questions=d.questions;renderQuiz(d.questions)}
    else{document.getElementById("quiz-area").innerHTML='<div class="empty"><p>'+(d.error||"Try a different topic")+'</p></div>'}
  }catch(e){document.getElementById("quiz-area").innerHTML='<div class="empty"><p>'+e.message+'</p></div>'}
  btn.disabled=false; sp.style.display="none"; bt.textContent="✨ Generate";
}

function renderQuiz(qs){
  var html="";
  qs.forEach(function(q,i){
    html+='<div class="q-card" style="animation-delay:'+(i*0.07)+'s"><div class="q-num">Q'+(i+1)+'</div>';
    html+='<div class="q-text">'+q.question+'</div><div class="opts" id="opts-'+i+'">';
    Object.keys(q.options).forEach(function(k){
      html+='<div class="opt" data-qi="'+i+'" data-key="'+k+'"><strong>'+k+'.</strong> '+q.options[k]+'</div>';
    });
    html+='</div><div class="exp" id="exp-'+i+'">&#x1F4A1; '+q.explanation+'</div></div>';
  });
  html+='<div style="margin:16px 0 8px"><button class="btn btn-primary" onclick="submitQ()">Submit &#x1F3AF;</button></div>';
  document.getElementById("quiz-area").innerHTML=html;
  document.querySelectorAll(".opt").forEach(function(el){
    el.addEventListener("click",function(){
      if(submitted) return;
      var qi=parseInt(this.dataset.qi),key=this.dataset.key;
      answers[qi]=key;
      document.querySelectorAll("#opts-"+qi+" .opt").forEach(function(o){o.classList.remove("picked")});
      this.classList.add("picked");
    });
  });
}

function submitQ(){
  if(!questions.length) return;
  submitted=true; var score=0;
  questions.forEach(function(q,i){
    var correct=q.correct_answer,chosen=answers[i];
    Object.keys(q.options).forEach(function(k){
      var el=document.getElementById("opts-"+i)?.querySelector('[data-key="'+k+'"]');
      if(!el) return;
      el.classList.remove("picked");
      if(k===correct) el.classList.add("correct");
      else if(k===chosen&&chosen!==correct) el.classList.add("wrong");
    });
    if(chosen===correct) score++;
    document.getElementById("exp-"+i).style.display="block";
  });
  var pct=Math.round(score/questions.length*100);
  var sb=document.getElementById("score-box");
  document.getElementById("score-num").textContent=score+"/"+questions.length+" ("+pct+"%)";
  document.getElementById("sfill").style.width=pct+"%";
  var msgs=["Keep going! &#x1F4AA;","Good effort! &#x1F44D;","Well done! &#x1F31F;","Excellent! &#x1F3C6;","Perfect! &#x1F389;"];
  document.getElementById("score-msg").innerHTML=msgs[pct<25?0:pct<50?1:pct<75?2:pct<100?3:4];
  sb.style.display="block"; sb.scrollIntoView({behavior:"smooth",block:"start"});
}

if(!tok()){location.href="login.html"}else{init()}
</script>
</body>
</html>
