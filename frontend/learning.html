<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learning Hub - CourseCraft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#050814;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#050814,#0a1128,#050814);z-index:0}
.bg::before{content:"";position:absolute;inset:-50%;background:radial-gradient(circle at 30% 50%,rgba(99,102,241,.08),transparent 50%),radial-gradient(circle at 70% 70%,rgba(168,85,247,.08),transparent 50%);animation:rot 20s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
nav{position:sticky;top:0;z-index:100;background:rgba(10,17,40,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(99,102,241,.15);padding:16px 40px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{color:rgba(255,255,255,.7);text-decoration:none;font-size:15px;transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.btn-logout{background:linear-gradient(135deg,#ec4899,#8b5cf6);border:none;color:#fff;padding:10px 22px;border-radius:25px;cursor:pointer;font-weight:600;font-size:14px;transition:.3s}
.btn-logout:hover{transform:translateY(-2px)}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px;position:relative;z-index:1}
h1{font-size:46px;font-weight:900;background:linear-gradient(135deg,#fff,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:rgba(255,255,255,.55);font-size:17px;margin-bottom:36px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:36px;flex-wrap:wrap}
.tab{padding:11px 26px;border-radius:25px;border:1px solid rgba(99,102,241,.3);background:rgba(99,102,241,.1);color:rgba(255,255,255,.7);cursor:pointer;font-size:15px;font-weight:500;transition:.3s}
.tab.active,.tab:hover{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border-color:transparent;box-shadow:0 5px 20px rgba(99,102,241,.4)}
.panel{display:none}.panel.active{display:block}
.card{background:rgba(17,24,39,.75);backdrop-filter:blur(20px);border:1px solid rgba(99,102,241,.2);border-radius:20px;padding:30px;margin-bottom:22px}
.card h2{font-size:21px;font-weight:700;margin-bottom:20px;color:#a78bfa}
label{display:block;font-size:13px;color:rgba(255,255,255,.55);margin-bottom:6px;font-weight:500;margin-top:4px}
select,input,textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(99,102,241,.25);border-radius:12px;color:#fff;font-size:15px;outline:none;transition:.3s;font-family:inherit;margin-bottom:14px}
select:focus,input:focus,textarea:focus{border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,.2)}
select option{background:#0a1128}
textarea{min-height:130px;resize:vertical}
.btn{padding:13px 28px;border:none;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;transition:.3s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.55)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-sec{background:rgba(99,102,241,.15);color:#a78bfa;border:1px solid rgba(99,102,241,.3)}
.btn-sec:hover{background:rgba(99,102,241,.25)}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;padding:13px 18px;border-radius:12px;margin-bottom:14px;display:none;font-size:14px}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#fca5a5;padding:13px 18px;border-radius:12px;margin-bottom:14px;display:none;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-block;padding:5px 13px;background:rgba(99,102,241,.14);border-radius:20px;font-size:12px;color:#a78bfa;margin:3px;cursor:pointer;border:1px solid rgba(99,102,241,.2);transition:.2s}
.chip:hover{background:rgba(99,102,241,.3)}
.q-card{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.18);border-radius:16px;padding:24px;margin-bottom:16px;animation:up .4s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:11px;color:#6366f1;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:17px;font-weight:600;margin-bottom:16px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{padding:11px 15px;border-radius:10px;border:1px solid rgba(99,102,241,.2);background:rgba(255,255,255,.04);cursor:pointer;transition:.25s;font-size:14px}
.opt:hover{border-color:#6366f1;background:rgba(99,102,241,.15)}
.opt.correct{border-color:#22c55e!important;background:rgba(34,197,94,.14)!important;color:#86efac}
.opt.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.12)!important;color:#fca5a5}
.opt.picked{border-color:#6366f1;background:rgba(99,102,241,.2)}
.exp{margin-top:14px;padding:12px 16px;background:rgba(168,85,247,.1);border-left:3px solid #a855f7;border-radius:0 8px 8px 0;font-size:13px;color:rgba(255,255,255,.72);display:none}
.sbar{background:rgba(99,102,241,.1);border-radius:10px;height:10px;margin:10px 0}
.sfill{height:100%;border-radius:10px;background:linear-gradient(90deg,#6366f1,#a855f7);transition:width .7s ease}
.hi{padding:15px 18px;border-radius:12px;border:1px solid rgba(99,102,241,.14);background:rgba(99,102,241,.06);margin-bottom:11px;cursor:pointer;transition:.2s}
.hi:hover{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.12)}
.hm{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px}
.empty{text-align:center;padding:55px 20px;color:rgba(255,255,255,.38)}
.empty-icon{font-size:52px;margin-bottom:14px}
@media(max-width:700px){.opts,.g2{grid-template-columns:1fr}h1{font-size:30px}nav{padding:14px 18px}.wrap{padding:22px 14px}}
</style>
</head>
<body>
<div class="bg"></div>
<nav>
  <a href="index.html" class="logo">CourseCraft</a>
  <div class="nav-links">
    <a href="index.html">Courses</a>
    <a href="Mylearning.html">My Learning</a>
    <a href="learning.html" class="active">Learning Hub</a>
    <a href="chat.html">Chat</a>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="wrap">
  <h1>Learning Hub &#x1F9E0;</h1>
  <p class="sub">Upload your syllabus &amp; get AI-powered practice questions</p>
  <div class="tabs">
    <button class="tab active" id="tab-btn-upload" onclick="switchTab('upload')">&#x1F4E4; Upload Syllabus</button>
    <button class="tab" id="tab-btn-practice" onclick="switchTab('practice')">&#x1F916; AI Practice</button>
    <button class="tab" id="tab-btn-history" onclick="switchTab('history')">&#x1F4CB; History</button>
  </div>

  <!-- UPLOAD -->
  <div class="panel active" id="tab-upload">
    <div class="card">
      <h2>&#x1F4DA; Upload Course Syllabus</h2>
      <div class="ok" id="up-ok"></div>
      <div class="err" id="up-err"></div>
      <label>Select Course</label>
      <select id="up-course"></select>
      <label>Syllabus Content</label>
      <textarea id="up-content" placeholder="Paste the full syllabus — topics, modules, learning outcomes..."></textarea>
      <label>Key Topics (comma-separated)</label>
      <input id="up-topics" type="text" placeholder="Arrays, Sorting, Binary Trees, SQL Joins...">
      <label>Upload PDF / TXT (optional)</label>
      <input id="up-file" type="file" accept=".pdf,.txt">
      <br>
      <button class="btn btn-primary" id="up-btn" onclick="uploadSyllabus()">
        <div class="spin" id="up-spin"></div>
        <span id="up-btxt">Upload Syllabus</span>
      </button>
    </div>
  </div>

  <!-- PRACTICE -->
  <div class="panel" id="tab-practice">
    <div class="card">
      <h2>&#x1F916; Generate Practice Questions</h2>
      <div class="g2">
        <div>
          <label>Course</label>
          <select id="pr-course" onchange="loadTopics()"></select>
        </div>
        <div>
          <label>Number of Questions</label>
          <select id="pr-num">
            <option value="3">3 Questions</option>
            <option value="5" selected>5 Questions</option>
            <option value="8">8 Questions</option>
            <option value="10">10 Questions</option>
          </select>
        </div>
      </div>
      <label>Topic to Practice</label>
      <input id="pr-topic" type="text" placeholder="e.g. Binary Search, React Hooks, SQL Joins...">
      <div id="chips" style="margin-bottom:14px"></div>
      <button class="btn btn-primary" id="pr-btn" onclick="generateQuestions()">
        <div class="spin" id="pr-spin"></div>
        <span id="pr-btxt">&#x2728; Generate Questions</span>
      </button>
    </div>
    <div id="quiz-area"></div>
    <div id="quiz-result" class="card" style="display:none">
      <h2>&#x1F3AF; Your Score</h2>
      <div id="score-txt" style="font-size:30px;font-weight:800;color:#a78bfa;margin-bottom:10px"></div>
      <div class="sbar"><div class="sfill" id="sfill"></div></div>
      <p id="score-msg" style="color:rgba(255,255,255,.6);margin-top:10px"></p>
      <button class="btn btn-sec" style="margin-top:18px" onclick="generateQuestions()">Try Again &#x1F504;</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="panel" id="tab-history">
    <div class="card">
      <h2>&#x1F4CB; Practice History</h2>
      <div id="hist-list"><div class="empty"><div class="empty-icon">&#x23F3;</div><p>Loading...</p></div></div>
    </div>
  </div>
</div>

<script>
const API="http://localhost:8000";
let questions=[],answers={},submitted=false;

function logout(){localStorage.clear();location.href="login.html"}
function tok(){return localStorage.getItem("access_token")}
function authH(){return{"Authorization":"Bearer "+tok(),"Content-Type":"application/json"}}

function switchTab(id){
  ["upload","practice","history"].forEach(function(t){
    document.getElementById("tab-"+t).classList.remove("active");
    document.getElementById("tab-btn-"+t).classList.remove("active");
  });
  document.getElementById("tab-"+id).classList.add("active");
  document.getElementById("tab-btn-"+id).classList.add("active");
  if(id==="history") loadHistory();
}

async function loadCourses(){
  try{
    var r=await fetch(API+"/course/home/?page=1",{headers:{"Authorization":"Bearer "+tok()}});
    var d=await r.json();
    var courses=d.results||[];
    var opts=courses.map(function(c){return'<option value="'+c.id+'">'+c.course_name+'</option>';}).join("");
    document.getElementById("up-course").innerHTML=opts;
    document.getElementById("pr-course").innerHTML=opts;
    if(courses.length) loadTopics();
  }catch(e){console.error(e)}
}

async function loadTopics(){
  var cid=document.getElementById("pr-course").value;
  var ch=document.getElementById("chips");
  ch.innerHTML="";
  try{
    var r=await fetch(API+"/learning/syllabus/"+cid+"/",{headers:{"Authorization":"Bearer "+tok()}});
    if(!r.ok) return;
    var d=await r.json();
    if(d.topics){
      d.topics.split(",").forEach(function(t){
        var t2=t.trim();
        if(!t2) return;
        var span=document.createElement("span");
        span.className="chip";
        span.textContent=t2;
        span.onclick=function(){document.getElementById("pr-topic").value=t2;};
        ch.appendChild(span);
      });
    }
  }catch(e){}
}

async function uploadSyllabus(){
  var ok=document.getElementById("up-ok"),er=document.getElementById("up-err");
  ok.style.display="none"; er.style.display="none";
  var content=document.getElementById("up-content").value.trim();
  if(!content){er.textContent="Please enter syllabus content.";er.style.display="block";return;}
  var btn=document.getElementById("up-btn"),sp=document.getElementById("up-spin"),bt=document.getElementById("up-btxt");
  btn.disabled=true; sp.style.display="block"; bt.textContent="Uploading...";
  try{
    var fd=new FormData();
    fd.append("course",document.getElementById("up-course").value);
    fd.append("content",content);
    fd.append("topics",document.getElementById("up-topics").value.trim());
    var f=document.getElementById("up-file").files[0];
    if(f) fd.append("syllabus_file",f);
    var r=await fetch(API+"/learning/syllabus/upload/",{method:"POST",headers:{"Authorization":"Bearer "+tok()},body:fd});
    var d=await r.json();
    if(r.ok){ok.textContent="✅ "+d.message;ok.style.display="block";document.getElementById("up-content").value="";document.getElementById("up-topics").value="";}
    else{er.textContent="❌ "+(d.error||"Upload failed");er.style.display="block";}
  }catch(e){er.textContent="❌ "+e.message;er.style.display="block";}
  btn.disabled=false; sp.style.display="none"; bt.textContent="Upload Syllabus";
}

async function generateQuestions(){
  var topic=document.getElementById("pr-topic").value.trim();
  var cid=document.getElementById("pr-course").value;
  var num=document.getElementById("pr-num").value;
  if(!topic){alert("Please enter a topic to practice");return;}
  var btn=document.getElementById("pr-btn"),sp=document.getElementById("pr-spin"),bt=document.getElementById("pr-btxt");
  btn.disabled=true; sp.style.display="block"; bt.textContent="Generating...";
  document.getElementById("quiz-area").innerHTML='<div class="empty"><div class="empty-icon">&#x23F3;</div><p>AI is crafting your questions...</p></div>';
  document.getElementById("quiz-result").style.display="none";
  questions=[]; answers={}; submitted=false;
  try{
    var r=await fetch(API+"/learning/practice/generate/",{method:"POST",headers:authH(),body:JSON.stringify({course_id:cid,topic:topic,num_questions:parseInt(num)})});
    var d=await r.json();
    if(r.ok && d.questions && d.questions.length){
      questions=d.questions;
      renderQuiz(d.questions);
    } else {
      document.getElementById("quiz-area").innerHTML='<div class="card"><div class="empty"><div class="empty-icon">&#x274C;</div><p>'+(d.error||"No questions returned. Try a different topic.")+'</p></div></div>';
    }
  }catch(e){
    document.getElementById("quiz-area").innerHTML='<div class="card"><div class="empty"><div class="empty-icon">&#x274C;</div><p>'+e.message+'</p></div></div>';
  }
  btn.disabled=false; sp.style.display="none"; bt.textContent="✨ Generate Questions";
}

function renderQuiz(qs){
  var html="";
  qs.forEach(function(q,i){
    html+='<div class="q-card" style="animation-delay:'+(i*0.08)+'s" id="qcard-'+i+'">';
    html+='<div class="q-num">Question '+(i+1)+' of '+qs.length+'</div>';
    html+='<div class="q-text">'+q.question+'</div>';
    html+='<div class="opts" id="opts-'+i+'">';
    var keys=Object.keys(q.options);
    keys.forEach(function(k){
      html+='<div class="opt" id="opt-'+i+'-'+k+'" data-qi="'+i+'" data-key="'+k+'"><strong>'+k+'.</strong> '+q.options[k]+'</div>';
    });
    html+='</div>';
    html+='<div class="exp" id="exp-'+i+'">&#x1F4A1; <strong>Explanation:</strong> '+q.explanation+'</div>';
    html+='</div>';
  });
  html+='<div style="text-align:center;margin:20px 0"><button class="btn btn-primary" onclick="submitQuiz()">Submit Answers &#x1F3AF;</button></div>';
  document.getElementById("quiz-area").innerHTML=html;
  document.querySelectorAll(".opt").forEach(function(el){
    el.addEventListener("click",function(){
      var qi=parseInt(this.dataset.qi),key=this.dataset.key;
      if(submitted) return;
      answers[qi]=key;
      document.querySelectorAll("#opts-"+qi+" .opt").forEach(function(o){o.classList.remove("picked");});
      this.classList.add("picked");
    });
  });
}

function submitQuiz(){
  if(!questions.length) return;
  submitted=true;
  var score=0;
  questions.forEach(function(q,i){
    var correct=q.correct_answer,chosen=answers[i];
    Object.keys(q.options).forEach(function(k){
      var el=document.getElementById("opt-"+i+"-"+k);
      el.classList.remove("picked");
      if(k===correct) el.classList.add("correct");
      else if(k===chosen && chosen!==correct) el.classList.add("wrong");
    });
    if(chosen===correct) score++;
    document.getElementById("exp-"+i).style.display="block";
  });
  var pct=Math.round((score/questions.length)*100);
  document.getElementById("score-txt").textContent=score+" / "+questions.length+" correct ("+pct+"%)";
  document.getElementById("sfill").style.width=pct+"%";
  var msgs=["Keep practising! 💪","Good effort! 👍","Well done! 🌟","Excellent! 🏆","Perfect score! 🎉"];
  var mi=pct<25?0:pct<50?1:pct<75?2:pct<100?3:4;
  document.getElementById("score-msg").textContent=msgs[mi];
  var res=document.getElementById("quiz-result");
  res.style.display="block";
  res.scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadHistory(){
  var list=document.getElementById("hist-list");
  list.innerHTML='<div class="empty"><div class="empty-icon">&#x23F3;</div><p>Loading...</p></div>';
  try{
    var r=await fetch(API+"/learning/practice/history/",{headers:{"Authorization":"Bearer "+tok()}});
    var d=await r.json();
    if(!d.length){list.innerHTML='<div class="empty"><div class="empty-icon">&#x1F4D6;</div><p>No practice sessions yet. Go generate some questions!</p></div>';return;}
    list.innerHTML=d.map(function(s){
      var date=new Date(s.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
      var qcount=0;
      try{var p=JSON.parse(s.questions_generated);qcount=(p.questions||[]).length;}catch(e){}
      return '<div class="hi"><strong>'+s.topic_asked+'</strong> &mdash; '+qcount+' questions<div class="hm">Course #'+s.course+' &nbsp;|&nbsp; '+date+'</div></div>';
    }).join("");
  }catch(e){list.innerHTML='<div class="empty">Failed to load history</div>';}
}

if(!tok()){location.href="login.html";}else{loadCourses();}
</script>
</body>
</html>
